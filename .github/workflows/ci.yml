name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files through the API

# Every action is pinned to a full commit SHA, with its version in a comment.
# A tag like v4 can be moved by whoever controls the action, so a pin is the
# only way to be sure which code runs here. Dependabot (.github/dependabot.yml)
# opens a PR when a newer version comes out.

jobs:
  changes:
    name: Detect platform changes
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            linux:
              - '**'
              - '!src/pal/win32/**'
            windows:
              - '**'
              - '!src/pal/linux/**'

  linux-build:
    name: Linux build (${{ matrix.preset }})
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    # A normal run takes about 5 minutes. Without a limit, a test that hangs
    # holds the job for GitHub's 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-debug, linux-asan, linux-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          # Ubuntu 24.04's default clang is 18, which can't use libstdc++'s
          # std::expected (it reports C++20 concepts as incomplete). 20 can.
          # Sanitizer runtimes ship separately from clang on Ubuntu.
          # dbus gives the tests a session bus (see Test below).
          sudo apt-get install --no-install-recommends -y clang-20 libclang-rt-20-dev ninja-build pkg-config libpipewire-0.3-dev libsecret-1-dev libsystemd-dev dbus
          # What SDL3 needs to build its X11 and Wayland drivers for am-ui
          # (docs/SETUP.md). The test runs it with SDL's offscreen driver.
          sudo apt-get install --no-install-recommends -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdecor-0-dev
      - name: Allow ThreadSanitizer's memory layout
        if: matrix.preset == 'linux-tsan'
        # TSan aborts on Ubuntu's default ASLR entropy ("unexpected memory mapping").
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        # The C compiler too, for SDL3: sanitized C and C++ must come from the
        # same compiler.
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_C_COMPILER=clang-20
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # dbus-run-session starts a private D-Bus session bus for the run, so
        # the media keys (MPRIS) tests have one to talk over.
        run: dbus-run-session -- ctest --preset ${{ matrix.preset }} --timeout 300

  # Phase 1 gate (spec section 6): the IPC frame parser survives 10 million
  # fuzzed inputs under ASan and UBSan. The TSan and ASan test runs in the job
  # above cover the rest of the gate.
  ipc-fuzz:
    name: Fuzz IPC frame parser
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          # pkg-config, PipeWire, libsecret and libsystemd headers because
          # configuring the project looks for them (the PipeWire sink, the
          # keyring vault and the media keys). The X11 and Wayland ones too:
          # SDL3's configure stops if it finds neither, even though this job
          # only builds the fuzzer.
          sudo apt-get install --no-install-recommends -y clang-20 libclang-rt-20-dev ninja-build pkg-config libpipewire-0.3-dev libsecret-1-dev libsystemd-dev
          sudo apt-get install --no-install-recommends -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdecor-0-dev
      - name: Configure
        run: cmake --preset linux-fuzz -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_C_COMPILER=clang-20
      - name: Build
        run: cmake --build --preset linux-fuzz --target fuzz_ipc_framing
      - name: Fuzz
        # On a crash libFuzzer writes the input that caused it to crash-<hash>
        # in the working directory; the next step uploads it.
        working-directory: build/linux-fuzz
        run: ./tests/fuzz_ipc_framing -runs=10000000 -print_final_stats=1
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash
          path: |
            build/linux-fuzz/crash-*
            build/linux-fuzz/leak-*
            build/linux-fuzz/timeout-*
          if-no-files-found: ignore

  # Builds the daemon with CEF (the linux-cef preset) so the CEF host keeps
  # compiling, in a debug build and in the optimized one we measure and listen
  # with (linux-cef-release). It uses Google's prebuilt CEF of the same version
  # as ours: that one can't decode AAC, but it builds and links the same.
  # Nothing here plays anything; the hand test on a machine with our AAC build
  # does that.
  linux-cef-build:
    name: Linux build (${{ matrix.preset }})
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    # A normal run takes about 5 minutes. Without a limit, a test that hangs
    # holds the job for GitHub's 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-cef, linux-cef-release]
    env:
      CEF_VERSION: 150.0.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update
          # libx11-dev because CEF's Linux build links X11. The second line is
          # for SDL3 (am-ui), as in linux-build.
          sudo apt-get install --no-install-recommends -y clang-20 ninja-build pkg-config libpipewire-0.3-dev libsecret-1-dev libsystemd-dev libx11-dev dbus
          sudo apt-get install --no-install-recommends -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdecor-0-dev
      - name: Cache CEF
        id: cache-cef
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/cef
          key: cef-${{ env.CEF_VERSION }}-linux64-minimal
      - name: Download CEF
        if: steps.cache-cef.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party/cef
          cd third_party/cef
          curl -fsSL https://cef-builds.spotifycdn.com/index.json -o index.json
          # The "minimal" download of CEF_VERSION: release libraries only.
          read -r name sha1 < <(python3 -I - <<'PY'
          import json, os
          wanted = os.environ["CEF_VERSION"] + "+"
          for build in json.load(open("index.json"))["linux64"]["versions"]:
              if build["cef_version"].startswith(wanted):
                  for f in build["files"]:
                      if f["type"] == "minimal":
                          print(f["name"], f["sha1"])
                          raise SystemExit
          raise SystemExit("CEF " + wanted + " isn't in index.json")
          PY
          )
          curl -fsSL "https://cef-builds.spotifycdn.com/${name//+/%2B}" -o "$name"
          echo "$sha1  $name" | sha1sum -c -
          mkdir linux64
          tar -xjf "$name" -C linux64 --strip-components=1
          rm "$name" index.json
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_C_COMPILER=clang-20
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # The usual tests, with a daemon that links CEF but plays the tone.
        run: dbus-run-session -- ctest --preset ${{ matrix.preset }} --timeout 300
      - name: Check hardening
        # The only Release build in CI, so the only one with every flag from
        # cmake/Hardening.cmake (FORTIFY_SOURCE needs optimization). Each grep
        # fails the step if its mark is missing (docs/learning/hardening.md).
        if: matrix.preset == 'linux-cef-release'
        run: |
          daemon=build/linux-cef-release/scratterd
          readelf -hW "$daemon" | grep -q 'Position-Independent Executable'
          readelf -lW "$daemon" | grep -q GNU_RELRO
          readelf -dW "$daemon" | grep -q BIND_NOW
          nm -D "$daemon" | grep -q __stack_chk_fail
          nm -D "$daemon" | grep -q '_chk@'

  windows-build:
    name: Windows build
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install Ninja
        run: choco install ninja --no-progress -y
      - name: Configure
        run: cmake --preset windows-msvc-debug
      - name: Build
        run: cmake --build --preset windows-msvc-debug
      - name: Test
        # --timeout fails a single test that runs over 5 minutes (the slowest
        # take seconds), so a hang names the test that hung.
        run: ctest --preset windows-msvc-debug --timeout 300
